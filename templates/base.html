{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToDo{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 720px; margin: 0 auto; padding: 24px;
            background: #f5f6f8; color: #1c1e21;
        }
        h1 { margin-top: 0; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card {
            background: #fff; border-radius: 10px; padding: 16px 20px;
            margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        .task-title { font-size: 1.1rem; font-weight: 600; }
        .task-title.done { text-decoration: line-through; color: #8a8d91; }
        .meta { color: #65676b; font-size: .85rem; margin-top: 4px; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: .75rem; font-weight: 600;
        }
        .badge.done { background: #d1fae5; color: #065f46; }
        .badge.pending { background: #fee2e2; color: #991b1b; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
        input[type=text], textarea, select {
            width: 100%; padding: 9px 12px; border: 1px solid #ccd0d5;
            border-radius: 8px; font-size: 1rem; font-family: inherit;
        }
        .btn {
            display: inline-block; padding: 8px 16px; border-radius: 8px;
            border: none; cursor: pointer; font-size: .9rem; font-weight: 600;
            background: #2563eb; color: #fff;
        }
        .btn:hover { text-decoration: none; opacity: .9; }
        .btn.secondary { background: #e4e6eb; color: #1c1e21; }
        .btn.danger { background: #dc2626; color: #fff; }
        .btn.small { padding: 5px 10px; font-size: .8rem; }
        form.inline { display: inline; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: 600; margin-bottom: 4px; }
        .errorlist { color: #dc2626; list-style: none; padding: 0; margin: 4px 0; font-size: .85rem; }
        .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
        .search-row { display: flex; gap: 8px; }
        .search-row input { flex: 1; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
