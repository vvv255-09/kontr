<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Удаление задачи</title>
</head>
<body>
    <h1>Удалить задачу?</h1>
    <p>Ты точно хочешь удалить задачу «{{ task.title }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>
    <a href="{% url 'task_list' %}">Отмена</a>
</body>
</html>
